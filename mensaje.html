<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Metadatos y estilos compartidos con las demás páginas de la tienda. -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gracias por su compra | Retrogame Store</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caacupe+One&family=Open+Sans:ital,wght@0,300..800;1,300..800&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navegación principal de la tienda. -->
    <header>
        <div class="navbar" id="inicio">
            <nav aria-label="Navegación principal">
                <ul>
                    <li><a href="index.html#inicio">Inicio</a></li>
                    <li><a href="index.html#productos">Productos</a></li>
                    <li><a href="index.html#contacto">Contacto</a></li>
                    <li>
                        <a class="enlace-carrito" href="finalizar.html" aria-label="Ir al carrito de compras">
                            <svg aria-hidden="true" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="9" cy="21" r="1"></circle>
                                <circle cx="20" cy="21" r="1"></circle>
                                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                            </svg>
                            <span id="contador-carrito" aria-live="polite">0</span>
                        </a>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Confirmación de compra y acceso de regreso al catálogo. -->
    <main class="checkout-main">
        <section class="checkout-panel confirmacion-compra">
            <h1>Gracias por su compra</h1>
            <a class="boton-finalizar" href="index.html">Volver a la tienda</a>
        </section>
    </main>

    <!-- Identificación de la tienda al pie de la página. -->
    <footer class="checkout-footer">
        <p>Retrogame Store</p>
    </footer>

    <!-- Carga de datos del catálogo y actualización del contador del carrito. -->
    <script src="js/productos.js"></script>
    <script src="js/carrito.js"></script>
</body>
</html>
